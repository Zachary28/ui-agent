[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "midscene-ui-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.9",
  "langgraph-checkpoint-sqlite==3.1.0",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "python-dotenv==1.2.2",
  "rich==15.0.0",
  "typer==0.27.0",
]

[project.scripts]
midscene-ui-agent = "midscene_ui_agent.interfaces.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.16,<2",
  "pytest==9.1.1",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: opt-in Web/Android integration tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
packages = ["midscene_ui_agent"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
midscene_ui_agent = ["config/**/*.yaml", "config/**/*.json"]
